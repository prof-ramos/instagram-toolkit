[project]
name = "instagram-toolkit"
version = "0.1.0"
description = "Instagram Toolkit v2.2 - Ferramenta completa para automação e análise do Instagram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instagrapi>=2.7.10",
    "requests>=2.31.0",
    "phonenumbers>=8.13.0",
    "pycountry>=22.3.5",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instagram_toolkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
