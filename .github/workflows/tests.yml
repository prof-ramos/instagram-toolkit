name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: '.python-version'
      - name: Sync dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
