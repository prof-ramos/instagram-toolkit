name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
