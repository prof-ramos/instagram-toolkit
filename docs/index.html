<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Toolkit</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 2rem; line-height: 1.6; }
    h1 { color: #E1306C; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 8px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>📸 Instagram Toolkit</h1>
  <p>Ferramenta CLI para automação e análise de contas do Instagram.</p>
  <h2>Funcionalidades</h2>
  <ul>
    <li>Listar seguidores/seguidos</li>
    <li>Seguir/Deixar de seguir</li>
    <li>Rastrear unfollowers</li>
    <li>Auto follow-back</li>
    <li>Estatísticas de crescimento</li>
  </ul>
  <h2>Instalação</h2>
  <pre><code>uv run main.py</code></pre>
  <hr>
  <p><small><a href="https://github.com/prof-ramos/instagram-toolkit">GitHub</a></small></p>
</body>
</html>
